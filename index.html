<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crypto IDX Signal">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Crypto IDX | One Combined Signal</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#080e20;color:#eef4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#203b70 0%,#080e20 65%);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(22px,5vw,32px);margin:0}p{color:#9cb0ce}.pill,.tag{padding:9px 12px;border:1px solid #2b3d5e;border-radius:30px;background:#101b32;color:#c3d2ec;font-size:13px}.hero{margin-top:22px;padding:30px 18px;border-radius:22px;background:linear-gradient(145deg,#172947,#0d172d);border:1px solid #294063;text-align:center;box-shadow:0 18px 60px #0005}.eyebrow{letter-spacing:2px;text-transform:uppercase;color:#91a7cb;font-size:12px}.signal{font-size:clamp(58px,13vw,106px);font-weight:900;letter-spacing:3px;margin:8px 0}.up{color:#37e4a3}.down{color:#ff667c}.wait{color:#ffc66d}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.stats span{border:1px solid #314365;border-radius:12px;padding:9px 12px;color:#c9d7ee}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{cursor:pointer;background:#294b86;border:1px solid #4a70b2;border-radius:12px;color:white;padding:12px 18px;font-weight:700}button:disabled{opacity:.55;cursor:wait}button.secondary{background:#14223e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:15px}.card{padding:16px;border-radius:16px;border:1px solid #293b5b;background:#111c33}.card strong{font-size:18px}.card .value{font-size:24px;font-weight:800;margin:8px 0}.muted{color:#9caecc;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h2{font-size:19px;margin-top:30px}.history{padding:0;list-style:none}.history li{padding:12px;border-bottom:1px solid #253651;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.note{font-size:13px;line-height:1.5;color:#a7b9d7}details{margin-top:20px;border:1px solid #293b5b;border-radius:14px;padding:15px;background:#111c33}summary{cursor:pointer;font-weight:700}footer{margin-top:30px;font-size:12px;color:#7f96b9}@media(max-width:500px){.wrap{padding-top:16px}.hero{padding:26px 12px}.stats span{font-size:12px}}
</style>
</head>
<body>

<!-- PYTHON LIVE SIGNAL PANEL -->
<div id="python-live-panel" style="
  margin:20px auto;
  padding:20px;
  max-width:700px;
  border:1px solid #24466a;
  border-radius:16px;
  background:#0b1830;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
">
  <h2>Python Live Signal</h2>
  <p id="py-connection">Connecting to Python...</p>

  <div id="py-signal" style="
    font-size:52px;
    font-weight:bold;
    color:#facc15;
    margin:15px 0;
  ">WAIT</div>

  <p id="py-indicators">Loading indicators...</p>
  <p id="py-updated">Last update: --</p>
  <p id="py-countdown">Next update: --</p>

  <button id="py-refresh" type="button" style="
    background:#16a085;
    color:white;
    border:0;
    border-radius:8px;
    padding:12px 24px;
    cursor:pointer;
  ">Refresh Python Signal</button>
</div>

<script>
(function () {
  "use strict";

  const API =
    "https://crypto-idx-capture-1.onrender.com/signal";

  const INTERVAL = 60000;

  const $ = id => document.getElementById(id);

  let lastAttempt = 0;
  let busy = false;

  async function updatePythonSignal() {
    if (busy) return;

    busy = true;
    lastAttempt = Date.now();

    $("py-connection").textContent = "Updating...";

    const controller = new AbortController();
    const timeout = setTimeout(
      () => controller.abort(),
      25000
    );

    try {
      const response = await fetch(API, {
        cache: "no-store",
        signal: controller.signal
      });

      if (!response.ok) {
        throw new Error("API HTTP " + response.status);
      }

      const data = await response.json();

      const valid =
        data &&
        ["UP", "DOWN", "WAIT"].includes(data.signal);

      if (!valid) {
        throw new Error("Invalid signal response");
      }

      if (data.error || data.reason) {
        throw new Error(
          data.reason || "Market data unavailable"
        );
      }

      const signal = data.signal;

      $("py-signal").textContent = signal;

      $("py-signal").style.color =
        signal === "UP" ? "#22c55e" :
        signal === "DOWN" ? "#ef4444" :
        "#facc15";

      const format = (value, digits = 2) =>
        typeof value === "number"
          ? value.toFixed(digits)
          : "--";

      $("py-indicators").textContent =
        "RSI: " + format(data.rsi) +
        " | EMA9: " + format(data.ema9) +
        " | EMA21: " + format(data.ema21) +
        " | MACD: " + format(data.macd, 4);

      $("py-connection").textContent =
        "Connected | Binance BTCUSDT";

      $("py-updated").textContent =
        "Last update: " +
        new Date().toLocaleTimeString();

    } catch (error) {
      $("py-signal").textContent = "WAIT";
      $("py-signal").style.color = "#facc15";

      $("py-connection").textContent =
        "Connection issue: " + error.message;

      $("py-indicators").textContent =
        "No verified fresh signal";

    } finally {
      clearTimeout(timeout);
      busy = false;
    }
  }

  function countdown() {
    const remaining = Math.max(
      0,
      Math.ceil(
        (INTERVAL - (Date.now() - lastAttempt)) / 1000
      )
    );

    $("py-countdown").textContent =
      "Next update: " + remaining + "s";
  }

  $("py-refresh").addEventListener(
    "click",
    updatePythonSignal
  );

  updatePythonSignal();

  setInterval(() => {
    if (!document.hidden &&
        Date.now() - lastAttempt >= INTERVAL) {
      updatePythonSignal();
    }
  }, 1000);

  setInterval(countdown, 1000);

  document.addEventListener(
    "visibilitychange",
    () => {
      if (!document.hidden &&
          Date.now() - lastAttempt >= INTERVAL) {
        updatePythonSignal();
      }
    }
  );
})();
</script>
<!-- END PYTHON LIVE SIGNAL PANEL -->
</body>
</html>
